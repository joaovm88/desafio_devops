name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore EcoCity.sln
      - run: dotnet build EcoCity.sln -c Release --no-restore
      - name: Testes automatizados
        run: dotnet test EcoCity.sln -c Release --no-build --logger "trx;LogFileName=resultado.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: TestResults

  docker:
    name: Imagem Docker
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          repo=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build (PR) ou Build+Push (main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh staging "${{ needs.docker.outputs.image }}"
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

  deploy-production:
    name: Deploy Produção
    if: github.event_name != 'pull_request'
    needs: [docker, deploy-staging]
    runs-on: ubuntu-latest
    environment: production   # configure "Required reviewers" para aprovação manual
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/deploy.sh production "${{ needs.docker.outputs.image }}"
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
